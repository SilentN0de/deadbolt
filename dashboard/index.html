<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadbolt</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f1419; color: #e6edf3; }
  h1 { font-size: 1.4rem; }
  .sub { color: #8b949e; margin-bottom: 1.5rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #30363d; }
  th { color: #8b949e; text-transform: uppercase; font-size: 0.75rem; }
  .sev-info { color: #79c0ff; } .sev-low { color: #7ee787; }
  .sev-medium { color: #ffa657; } .sev-high { color: #ff7b72; } .sev-critical { color: #ff4444; font-weight: bold; }
  .status { padding: 0.15rem 0.5rem; border-radius: 999px; background: #21262d; font-size: 0.8rem; }
  #error { color: #ff7b72; }
  .meta { color: #8b949e; font-size: 0.85rem; margin-bottom: 1rem; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #161b22; }
  #detail { margin-top: 1.5rem; padding: 1rem 1.25rem; border: 1px solid #30363d;
            border-radius: 8px; background: #161b22; max-width: 70rem; }
  #detail h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  #detail h3 { font-size: 0.8rem; text-transform: uppercase; color: #8b949e;
               margin: 1rem 0 0.35rem; }
  #detail p { margin: 0.25rem 0; font-size: 0.92rem; line-height: 1.45; }
  #detail ul { margin: 0.25rem 0; padding-left: 1.25rem; font-size: 0.92rem; }
  #detail li { margin: 0.2rem 0; }
  #detail .close { float: right; cursor: pointer; color: #8b949e; }
  #detail .vbtn { margin-top: 1rem; padding: 0.45rem 1rem; border: 1px solid #30363d;
                  border-radius: 6px; background: #238636; color: #fff; cursor: pointer;
                  font-size: 0.9rem; }
  #detail .vbtn:disabled { background: #21262d; color: #8b949e; cursor: default; }
  #detail .vresult { margin-top: 1rem; padding: 0.75rem; border: 1px solid #30363d;
                    border-radius: 6px; background: #0d1117; }
  #detail .vresult h4 { margin: 0 0 0.4rem; font-size: 0.95rem; }
  .verdict-confirmed { color: #7ee787; } .verdict-contradicted { color: #ff7b72; }
  .verdict-intel { color: #79c0ff; } .verdict-inconclusive { color: #8b949e; }
</style>
</head>
<body>
<h1>🔒 Deadbolt <span class="sub">v0.4</span></h1>
<div class="sub">Local-first findings. Nothing leaves this machine.</div>
<div id="trends" style="display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap;"></div>
<div class="meta" id="meta">loading…</div>
<div id="exportbar" style="margin-bottom: 1rem;">
  <button id="export-btn" class="vbtn" style="padding: 0.4rem 0.9rem; border: 1px solid #30363d; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; font-size: 0.85rem;">⬆ Export to Splunk</button>
  <select id="export-mode" style="margin-left: 0.5rem; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.35rem;">
    <option value="spool">spool file (Universal Forwarder)</option>
    <option value="hec">HEC (needs SPLUNK_HEC_URL/TOKEN)</option>
  </select>
  <span id="export-result" class="meta" style="margin-left: 0.75rem;"></span>
</div>
<div id="schedbar" style="margin-bottom: 1.25rem; padding: 0.9rem 1rem; border: 1px solid #30363d; border-radius: 8px; background: #161b22; max-width: 70rem;">
  <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
    <strong style="font-size: 0.95rem;">⏰ Scheduled scans</strong>
    <label style="font-size: 0.85rem;"><input type="checkbox" id="sched-enabled"> enabled</label>
    <select id="sched-cadence" style="background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.35rem; font-size: 0.85rem;">
      <option value="daily">once a day</option>
      <option value="weekly">once a week</option>
      <option value="interval">every N hours</option>
    </select>
    <span id="sched-time-wrap"><input type="time" id="sched-time" value="02:00" style="background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.3rem; font-size: 0.85rem;"></span>
    <select id="sched-weekday" hidden style="background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.35rem; font-size: 0.85rem;">
      <option value="0">Monday</option><option value="1">Tuesday</option>
      <option value="2">Wednesday</option><option value="3">Thursday</option>
      <option value="4">Friday</option><option value="5">Saturday</option>
      <option value="6">Sunday</option>
    </select>
    <span id="sched-interval-wrap" hidden><input type="number" id="sched-interval" value="24" min="0.25" max="744" step="0.25" style="width: 4.5rem; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 0.3rem; font-size: 0.85rem;"> <span class="meta">hours</span></span>
    <label style="font-size: 0.85rem;" title="Run read-only validation checks on new findings during scheduled scans"><input type="checkbox" id="sched-autoval" checked> auto-validate</label>
    <button id="sched-save" style="padding: 0.4rem 0.9rem; border: 1px solid #30363d; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; font-size: 0.85rem;">Save schedule</button>
    <button id="sched-run" style="padding: 0.4rem 0.9rem; border: 1px solid #30363d; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; font-size: 0.85rem;">▶ Run scan now</button>
  </div>
  <div class="meta" id="sched-status" style="margin: 0.5rem 0 0;">loading schedule…</div>
</div>
<div id="error"></div>
<table id="findings" hidden>
  <thead>
    <tr><th>Target</th><th>Title</th><th>Severity</th><th>Status</th><th>First seen</th><th>Last seen</th></tr>
  </thead>
  <tbody></tbody>
</table>
<div id="detail" hidden></div>
<script>
async function load() {
  loadTrends();
  loadSchedule();
  try {
    const res = await fetch('/findings');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const findings = await res.json();
    document.getElementById('meta').textContent =
      findings.length + ' finding(s) stored locally.';
    const tbody = document.querySelector('#findings tbody');
    tbody.innerHTML = '';
    for (const f of findings) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><code>' + f.target + '</code></td>' +
        '<td>' + escapeHtml(f.title) + '</td>' +
        '<td><span class="sev-' + f.severity + '">' + f.severity + '</span></td>' +
        '<td><span class="status">' + f.status + '</span></td>' +
        '<td>' + (f.first_seen || '') + '</td>' +
        '<td>' + (f.last_seen || '') + '</td>';
      tr.addEventListener('click', () => showExplanation(f.id));
      tbody.appendChild(tr);
    }
    document.getElementById('findings').hidden = false;
  } catch (e) {
    document.getElementById('error').textContent = 'Failed to load findings: ' + e;
    document.getElementById('meta').textContent = '';
  }
}
document.getElementById('export-btn').addEventListener('click', async () => {
  const btn = document.getElementById('export-btn');
  const mode = document.getElementById('export-mode').value;
  const out = document.getElementById('export-result');
  btn.disabled = true;
  out.textContent = 'Exporting…';
  try {
    const res = await fetch('/export/splunk',
      {method: 'POST', headers: {'Content-Type': 'application/json'},
       body: JSON.stringify({mode})});
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('HTTP ' + res.status + (body.detail ? ': ' + body.detail : ''));
    out.textContent = mode === 'spool'
      ? 'Wrote ' + body.events + ' event(s) → ' + body.path
      : 'Sent ' + body.events + ' event(s) to HEC.';
  } catch (err) {
    out.textContent = 'Export failed: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
async function showExplanation(findingId) {
  const detail = document.getElementById('detail');
  detail.hidden = false;
  detail.innerHTML = '<p class="meta">Analyzing locally…</p>';
  try {
    const res = await fetch('/findings/' + encodeURIComponent(findingId) + '/explanation');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const e = await res.json();
    const steps = e.what_to_do.map(s => '<li>' + escapeHtml(s) + '</li>').join('');
    detail.innerHTML =
      '<span class="close" id="detail-close">✕ close</span>' +
      '<h2>🕵️ Analyst: ' + escapeHtml(e.summary) + '</h2>' +
      '<p class="meta">Severity: <span class="sev-' + e.severity + '">' + e.severity +
      '</span> · generated locally, no data left this machine</p>' +
      '<h3>What was observed</h3><p>' + escapeHtml(e.what_was_observed) + '</p>' +
      '<h3>What it means</h3><p>' + escapeHtml(e.what_it_means) + '</p>' +
      '<h3>Why it matters</h3><p>' + escapeHtml(e.why_it_matters) + '</p>' +
      '<h3>What to do</h3><ul>' + steps + '</ul>' +
      '<h3>Confidence</h3><p>' + escapeHtml(e.confidence) + '</p>' +
      '<button class="vbtn" id="validate-btn">✔ Run validation</button>' +
      '<div id="vresult"></div><div id="vhistory"></div>';
    document.getElementById('detail-close').addEventListener('click', () => {
      detail.hidden = true;
    });
    document.getElementById('validate-btn').addEventListener('click', () => {
      runValidation(findingId);
    });
    loadValidationHistory(findingId);
    detail.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  } catch (err) {
    detail.innerHTML = '<p id="error">Failed to load explanation: ' + escapeHtml(err) + '</p>';
  }
}
async function runValidation(findingId) {
  const btn = document.getElementById('validate-btn');
  const box = document.getElementById('vresult');
  btn.disabled = true;
  box.innerHTML = '<p class="meta">Running read-only validation checks…</p>';
  try {
    const res = await fetch('/findings/' + encodeURIComponent(findingId) + '/validate',
      {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error('HTTP ' + res.status + (err.detail ? ': ' + err.detail : ''));
    }
    const v = await res.json();
    const rows = v.results.map(r =>
      '<li><span class="verdict-' + r.verdict + '">[' + r.verdict + ']</span> ' +
      '<b>' + escapeHtml(r.check) + ':</b> ' + escapeHtml(r.summary) + '</li>').join('');
    box.innerHTML = '<div class="vresult"><h4>Validation outcome: ' +
      '<span class="verdict-' + (v.outcome === 'confirmed' ? 'confirmed' :
        v.outcome === 'false-positive' ? 'contradicted' : 'intel') + '">' +
      escapeHtml(v.outcome) + '</span> ' +
      '<span class="meta">(status: ' + escapeHtml(v.status_before) + ' → ' +
      escapeHtml(v.status_after) + ')</span></h4><ul>' + rows + '</ul></div>';
    loadValidationHistory(findingId);
  } catch (err) {
    box.innerHTML = '<p id="error">Validation failed: ' + escapeHtml(err) + '</p>';
  } finally {
    btn.disabled = false;
  }
}
async function loadValidationHistory(findingId) {
  const box = document.getElementById('vhistory');
  if (!box) return;
  try {
    const res = await fetch('/findings/' + encodeURIComponent(findingId) + '/validations');
    if (!res.ok) return;
    const hist = await res.json();
    if (!hist.length) { box.innerHTML = ''; return; }
    const rows = hist.map(v =>
      '<li>' + escapeHtml(v.timestamp) + ' — <b>' + escapeHtml(v.outcome) + '</b> ' +
      '<span class="meta">(' + v.checks.map(escapeHtml).join(', ') + '; ' +
      escapeHtml(v.status_before) + ' → ' + escapeHtml(v.status_after) + ')</span></li>').join('');
    box.innerHTML = '<h3>Validation history</h3><ul>' + rows + '</ul>';
  } catch (err) { /* history is best-effort */ }
}
async function loadTrends() {
  const box = document.getElementById('trends');
  try {
    const res = await fetch('/trends/summary?days=30');
    if (!res.ok) return;
    const t = await res.json();
    const mttf = t.mean_time_to_fix_seconds == null
      ? '—'
      : t.mean_time_to_fix_seconds < 90
        ? Math.round(t.mean_time_to_fix_seconds) + 's'
        : (t.mean_time_to_fix_seconds / 3600).toFixed(1) + 'h';
    const cards = [
      ['Open', t.open, '#ffa657'],
      ['Fixed', t.fixed_total, '#7ee787'],
      ['False positives', t.false_positive_total, '#8b949e'],
      ['New (30d)', t.new_in_period, '#79c0ff'],
      ['Mean time to fix', mttf, '#e6edf3'],
    ];
    box.innerHTML = cards.map(([label, value, color]) =>
      '<div style="flex: 1 1 8rem; min-width: 8rem; padding: 0.6rem 0.9rem; ' +
      'border: 1px solid #30363d; border-radius: 8px; background: #161b22;">' +
      '<div style="font-size: 1.3rem; font-weight: 600; color: ' + color + ';">' +
      value + '</div>' +
      '<div class="meta" style="margin: 0;">' + label + '</div></div>'
    ).join('');
  } catch (err) { /* trends are best-effort */ }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function schedStatusLine(s) {
  const cfg = s.config;
  let when;
  if (!cfg.enabled) when = 'disabled';
  else if (cfg.cadence === 'daily') when = 'daily at ' + cfg.time;
  else if (cfg.cadence === 'weekly') when = 'weekly on ' + WEEKDAYS[cfg.weekday] + ' at ' + cfg.time;
  else when = 'every ' + cfg.interval_hours + 'h';
  let line = 'Schedule: ' + when;
  if (s.next_run && cfg.enabled) line += ' · next run ' + s.next_run.replace('T', ' ').slice(0, 16);
  if (s.last_run) line += ' · last run ' + s.last_run.replace('T', ' ').slice(0, 16);
  if (s.last_result && s.last_result.retest)
    line += ' · last scan: ' + s.last_result.retest.results + ' finding(s) retested';
  return line;
}
async function loadSchedule() {
  const out = document.getElementById('sched-status');
  try {
    const res = await fetch('/schedule');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const s = await res.json();
    const cfg = s.config;
    document.getElementById('sched-enabled').checked = !!cfg.enabled;
    document.getElementById('sched-cadence').value = cfg.cadence;
    document.getElementById('sched-time').value = cfg.time;
    document.getElementById('sched-weekday').value = String(cfg.weekday);
    document.getElementById('sched-interval').value = cfg.interval_hours;
    document.getElementById('sched-autoval').checked = !!cfg.auto_validate;
    updateSchedVisibility();
    out.textContent = schedStatusLine(s);
  } catch (err) {
    out.textContent = 'Could not load schedule: ' + err.message;
  }
}
function updateSchedVisibility() {
  const cadence = document.getElementById('sched-cadence').value;
  document.getElementById('sched-time-wrap').hidden = (cadence === 'interval');
  document.getElementById('sched-weekday').hidden = (cadence !== 'weekly');
  document.getElementById('sched-interval-wrap').hidden = (cadence !== 'interval');
}
document.getElementById('sched-cadence').addEventListener('change', updateSchedVisibility);
document.getElementById('sched-save').addEventListener('click', async () => {
  const out = document.getElementById('sched-status');
  const btn = document.getElementById('sched-save');
  btn.disabled = true;
  out.textContent = 'Saving…';
  const body = {
    enabled: document.getElementById('sched-enabled').checked,
    cadence: document.getElementById('sched-cadence').value,
    time: document.getElementById('sched-time').value || '02:00',
    weekday: parseInt(document.getElementById('sched-weekday').value, 10),
    interval_hours: parseFloat(document.getElementById('sched-interval').value),
    auto_validate: document.getElementById('sched-autoval').checked,
    scope_path: '',
    ports: null,
  };
  try {
    const res = await fetch('/schedule',
      {method: 'PUT', headers: {'Content-Type': 'application/json'},
       body: JSON.stringify(body)});
    const s = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('HTTP ' + res.status + (s.detail ? ': ' + s.detail : ''));
    out.textContent = 'Saved. ' + schedStatusLine(s);
  } catch (err) {
    out.textContent = 'Save failed: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('sched-run').addEventListener('click', async () => {
  const out = document.getElementById('sched-status');
  const btn = document.getElementById('sched-run');
  btn.disabled = true;
  out.textContent = 'Scan started in background — refresh in a bit to see results…';
  try {
    const res = await fetch('/schedule/run', {method: 'POST'});
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error('HTTP ' + res.status + (err.detail ? ': ' + err.detail : ''));
    }
  } catch (err) {
    out.textContent = 'Run failed: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
load();
</script>
</body>
</html>
